<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Loveheart Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
    }

    .scene {
      position: relative;
      width: 400px;
      height: 400px;
      transform-style: preserve-3d;
      animation: rotateHeart 10s linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes rotateHeart {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }

    /* Center message revealed during scatter */
    .center-message {
      position: absolute;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #ff4f7e, 0 0 24px #ff4f7e;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
      z-index: 10;
    }

    body.scattered .center-message {
      opacity: 1;
      transform: scale(1);
    }

    /* 3D position wrapper for each word */
    .word-node {
      position: absolute;
      transform-style: preserve-3d;
      transform: translate3d(var(--x), var(--y), var(--z)) rotateZ(var(--rot));
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease;
    }

    body.scattered .word-node {
      transform: translate3d(var(--sx), var(--sy), var(--sz)) rotateZ(var(--srot));
      opacity: 0.28;
    }

    /* Pink/red Mexican-wave effect from LoveWave.css */
    .love-word {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffb3cf;
      text-shadow: 0 0 10px currentColor;
      animation: loveWave 3s ease-in-out infinite;
      animation-delay: calc(var(--i) * 45ms);
      white-space: nowrap;
    }

    @keyframes loveWave {
      0%, 100% {
        color: #ffb3cf;
        transform: scale(1);
      }
      35% {
        color: #ff4f7e;
        transform: scale(1.12);
      }
    }
  </style>
</head>
<body>

  <div class="center-message">Forever yours</div>
  <div class="scene" id="heartScene"></div>

  <script>
    const scene = document.getElementById('heartScene');
    const pointsOnCurve = 44; // Number of words around the heart perimeter
    const depthLayers = 9;    // Number of 3D depth slices
    const layerSpacing = 12;  // Z-distance between slices in px
    const scale = 9.5;        // Overall size of the heart

    for (let l = 0; l < depthLayers; l++) {
      const z = (l - (depthLayers - 1) / 2) * layerSpacing;

      // Slight tapering on outer layers for a rounded 3D bevel
      const NormalizedLayer = Math.abs(l - (depthLayers - 1) / 2) / ((depthLayers - 1) / 2);
      const layerScale = scale * (1 - NormalizedLayer * 0.12);

      for (let i = 0; i < pointsOnCurve; i++) {
        const t = (i / pointsOnCurve) * Math.PI * 2;

        // Parametric heart equation
        const x = 16 * Math.pow(Math.sin(t), 3) * layerScale;
        const y = -(
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t)
        ) * layerScale;

        // Tangent angle so words follow the heart's contour
        const dx = 48 * Math.pow(Math.sin(t), 2) * Math.cos(t);
        const dy = -(
          -13 * Math.sin(t) +
          10 * Math.sin(2 * t) +
          6 * Math.sin(3 * t) +
          4 * Math.sin(4 * t)
        );
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);

        // Random 3D scatter coordinates for the explosion effect
        const sx = x * (1.8 + Math.random() * 1.4) + (Math.random() - 0.5) * 160;
        const sy = y * (1.8 + Math.random() * 1.4) + (Math.random() - 0.5) * 160;
        const sz = z * 4 + (Math.random() - 0.5) * 300;
        const srot = angle + (Math.random() - 0.5) * 180;

        const node = document.createElement('div');
        node.className = 'word-node';
        node.style.setProperty('--x', `${x.toFixed(1)}px`);
        node.style.setProperty('--y', `${y.toFixed(1)}px`);
        node.style.setProperty('--z', `${z.toFixed(1)}px`);
        node.style.setProperty('--rot', `${angle.toFixed(1)}deg`);
        node.style.setProperty('--sx', `${sx.toFixed(1)}px`);
        node.style.setProperty('--sy', `${sy.toFixed(1)}px`);
        node.style.setProperty('--sz', `${sz.toFixed(1)}px`);
        node.style.setProperty('--srot', `${srot.toFixed(1)}deg`);

        const word = document.createElement('span');
        word.className = 'love-word';
        word.style.setProperty('--i', i + l * 2);
        word.textContent = 'love';

        node.appendChild(word);
        scene.appendChild(node);
      }
    }

    // Toggle scatter on click or periodically like in the video
    document.body.addEventListener('click', () => {
      document.body.classList.toggle('scattered');
    });

    setInterval(() => {
      document.body.classList.add('scattered');
      setTimeout(() => {
        document.body.classList.remove('scattered');
      }, 3000);
    }, 9000);
  </script>
</body>
</html>
